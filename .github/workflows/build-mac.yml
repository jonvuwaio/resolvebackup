name: Build Mac app
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests
      - run: ./build_mac_app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Resolve-Backup-mac
          path: dist/Resolve-Backup.zip
